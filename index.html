am result and the likelihood of getting it are higher, and when waiting time and effort are lower; build offers by raising the first two and cutting the last two, add real bonuses, and use guarantees or urgency only if the user supplied them. FOUR WAYS TO GET CUSTOMERS: warm outreach, cold outreach, free helpful content and paid ads; a free useful guide or tip earns attention before any pitch. STORYBRAND: the customer is the hero with a problem, the business is the guide who shows empathy and authority, gives a simple plan, calls the customer to act, helps them avoid failure and describes success. SPIN QUESTIONS: ask about the Situation, then Problems, then the Implications of those problems, then the Need-payoff of fixing them. CHALLENGER APPROACH: teach the prospect something useful about their business, tailor it to them and guide the conversation with confidence. LIFE-FORCE DESIRES: people are driven by safety, comfort, freedom from fear, status, approval and care for loved ones; connect honest benefits to these. POSITIONING: own one clear idea or category in the customer's mind instead of claiming to be good at everything. ATTUNEMENT, BUOYANCY, CLARITY: see things from the prospect's side, stay positive after rejection and make the problem and next step clear. Trust and credibility close more sales than pressure.\nAS AN AGENT: be proactive. After each deliverable, suggest the best next step (a follow-up message, an A/B headline, a WhatsApp Status sequence or a reply to a likely objection) and offer it. Write ad copy as headline and copy only, no image descriptions, unless asked.";

async function submit(text,c){if(busy)return;text=(text||"").trim();if(!text&&!pend.length)return;

 c=c||cur()||mk();var um={r:"u",t:text||"Please look at the attached image.",n:pend.length,im:pend.map(function(p){return{mime:p.mime,data:p.data}})};

 if(k==="tools"){h="<h2>Marketing tools</h2><p class='muted'>Pick a format and the assistant will ask for what it needs.</p><div class='row'>"+FORMATS.map(function(f,i){return"<button class='btn' data-f='"+i+"'>"+esc(f)+"</button>"}).join("")+"</div><div class='row'><button class='btn' data-close>Close</button></div>"}
 if(k==="saved"){h="<h2>Saved work</h2>"+(S.saved.length?S.saved.map(function(x,i){return"<div class='item'><h4>"+esc(x.title)+"</h4><pre>"+esc(x.t)+"</pre><div class='row' style='margin:0'><button class='btn' data-c='"+i+"'>Copy</button><button class='btn' data-d='"+i+"'>Delete</button></div></div>"}).join(""):"<p class='muted'>Nothing saved yet. Use Save under any reply.</p>")+"<div class='row'><button class='btn' data-close>Close</button></div>"}
 if(k==="examples"){h="<h2>Examples of good ads</h2><p class='muted'>All examples are fictional and written to show structure. They are not real results and no performance claims are made.</p>"+EX.map(function(x,i){return"<div class='item'><span class='tag'>Fictional example</span> <span class='tag'>"+esc(x.g)+"</span><h4 style='margin-top:6px'>"+esc(x.t)+"</h4><p><b>Audience:</b> "+esc(x.a)+"</p><p><b>Headline:</b> "+esc(x.h)+"</p><p><b>Problem:</b> "+esc(x.p)+"</p><p><b>Call to action:</b> "+esc(x.c)+"</p><p><b>Why it may work:</b> "+esc(x.w)+"</p><button class='btn' data-e='"+i+"'>Create something similar</button></div>"}).join("")+"<div class='row'><button class='btn' data-close>Close</button></div>"}
 c.innerHTML=h;$("modal").classList.add("show");
 if(k==="settings"){var s=S.set;$("s_p").value=s.provider;$("s_k").value=getKey();$("s_m").value=s.model||"";$("s_b").value=s.base||"";$("s_r").checked=s.remember!==false;$("s_n").value=s.biz||"";$("s_d").value=s.desc||"";
  $("s_save").onclick=function(){s.provider=$("s_p").value;s.model=$("s_m").value.trim();s.base=$("s_b").value.trim();s.biz=$("s_n").value.trim();s.desc=$("s_d").value.trim();s.remember=$("s_r").checked;
   var v=$("s_k").value.trim();try{localStorage.removeItem(KK);sessionStorage.removeItem(KK);if(v)(s.remember?localStorage:sessionStorage).setItem(KK,v)}catch(e){}store();close();draw()};
  $("s_clear").onclick=function(){if(confirm("Delete all conversations, saved work and your key from this device?")){try{localStorage.removeItem(KEY);localStorage.removeItem(KK);sessionStorage.removeItem(KK)}catch(e){}location.reload()}}}
 c.querySelectorAll("[data-f]").forEach(function(b){b.onclick=function(){close();if(!ready()){modal("settings","Connect an AI key first.");return}var f=FORMATS[b.dataset.f];var cc=mk("The user chose the format: "+f+". Ask concise questions for any missing essentials, then write it.");submit("I need a "+f+".",cc)}});
 c.querySelectorAll("[data-c]").forEach(function(b){b.onclick=function(){copy(S.saved[b.dataset.c].t,b)}});

 c.querySelectorAll("[data-close]").forEach(function(b){b.onclick=close});
}
